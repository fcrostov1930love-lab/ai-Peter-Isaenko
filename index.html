<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Нерюнгри — Персональная Нейросеть</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e24; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; transition: background 0.3s; }
        .chat-container { display: none; width: 450px; height: 600px; background: #252532; border-radius: 12px; flex-direction: column; box-shadow: 0 8px 24px rgba(0,0,0,0.3); overflow: hidden; transition: background 0.3s; }
        .header { background: #2b2b3a; padding: 15px; text-align: center; border-bottom: 2px solid #20202b; transition: background 0.3s; }
        .header h3 { margin: 0; color: #ffffff; font-size: 20px; transition: color 0.3s; }
        .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #252532; transition: background 0.3s; }
        .msg { padding: 10px 14px; border-radius: 8px; max-width: 75%; word-wrap: break-word; line-height: 1.4; font-size: 15px; }
        .user { background: #007acc; color: #ffffff; align-self: flex-end; }
        .bot { background: #2f2f42; color: #ffffff; align-self: flex-start; border-left: 4px solid #00f0ff; }
        .input-area { display: flex; padding: 10px; background: #1e1e24; gap: 10px; transition: background 0.3s; }
        input { flex: 1; padding: 12px; border: 1px solid #2f2f42; border-radius: 6px; background: #252532; color: #ffffff; outline: none; }
        button { padding: 12px 20px; border: none; border-radius: 6px; background: #007acc; color: #ffffff; font-weight: bold; cursor: pointer; }
        button:hover { background: #0098ff; }
        #device-selector { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #15151c; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; color: white; }
        .selector-title { font-size: 22px; margin-bottom: 30px; text-align: center; max-width: 80%; line-height: 1.4; font-weight: bold; }
        .btn-container { display: flex; flex-direction: column; gap: 15px; width: 320px; }
        .device-btn { padding: 15px 20px; font-size: 17px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-align: center; text-decoration: none; transition: 0.2s; display: block; box-sizing: border-box; width: 100%; }
        .btn-pc { background-color: #28a745; color: white; }
        .btn-ios { background-color: #007AFF; color: white; }
        .btn-android { background-color: #A4C639; color: black; }
        .device-btn:hover { opacity: 0.9; transform: scale(1.03); }
        #download-window { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #1a1a24; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; text-align: center; }
        .download-box { background: #252532; padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); max-width: 420px; width: 90%; }
        .download-title { font-size: 20px; font-weight: bold; margin-bottom: 12px; color: #00f0ff; }
        .download-text { font-size: 14px; margin-bottom: 20px; color: #cccccc; line-height: 1.4; }
        .btn-download { background-color: #ff9800; color: white; margin-bottom: 15px; text-decoration: none; }
        .btn-back { background-color: #555566; color: white; font-size: 14px; padding: 8px 15px; }
    </style>
</head>
<body>
<div id="device-selector">
    <div class="selector-title">Привет! Выберите устройство для запуска ИИ «Нерюнгри»:</div>
    <div class="btn-container">
        <button onclick="showDownloadWindow('pc')" class="device-btn btn-pc">💻 Открыть на Ноутбуке</button>
        <button onclick="openOnIphone()" class="device-btn btn-ios">🍏 Открыть на iPhone</button>
        <button onclick="showDownloadWindow('android')" class="device-btn btn-android">🤖 Открыть на Андроиде</button>
    </div>
</div>

<div id="download-window">
    <div class="download-box">
        <div class="download-title" id="dl-title">Скачивание файла</div>
        <div class="download-text" id="dl-text">Нажмите на кнопку ниже, чтобы загрузить файл.</div>
        <button id="dl-action-btn" class="device-btn btn-download">📥 Скачать файл</button>
        <button onclick="closeDownloadWindow()" class="device-btn btn-back">⬅️ Назад</button>
    </div>
</div>

<div class="chat-container" id="main-chat">
    <div class="header">
        <h3 id="chat-title">🤖 ИИ Помощник: Нерюнгри</h3>
        <small>Локальный мозг + Интернет ядро</small>
    </div>
    <div class="messages" id="chat-box">
        <div class="msg bot">🤖 Приветик! Система «Нерюнгри» успешно запущена! Чем могу помочь?</div>
    </div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Напишите пример или вопрос..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()">Отправить</button>
    </div>
</div>

<script>
const fullSmartCode = '<!DOCTYPE html>' +
'<html lang="ru">' +
'<head>' +
'    <meta charset="UTF-8">' +
'    <meta name="viewport" content="width=device-width,initial-scale=1.0">' +
'    <title>🤖 Нерюнгри Автономный</title>' +
'    <style>' +
'        body{font-family:Arial,sans-serif;background:#15151c;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}' +
'        .chat-container{width:100%;height:100vh;max-width:450px;background:#1e1e24;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(0,0,0,0.4);}' +
'        .header{background:#252532;padding:15px;text-align:center;border-bottom:2px solid #15151c;}' +
'        .header h3{margin:0;font-size:18px;color:#00f0ff;}' +
'        .messages{flex:1;padding:15px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}' +
'        .msg{padding:10px 14px;border-radius:8px;max-width:75%;word-wrap:break-word;font-size:15px;line-height:1.4;}' +
'        .user{background:#007acc;align-self:flex-end;}' +
'        .bot{background:#2f2f42;align-self:flex-start;border-left:4px solid #00f0ff;}' +
'        .input-area{display:flex;padding:10px;background:#15151c;gap:10px;}' +
'        input{flex:1;padding:12px;border:1px solid #2f2f42;border-radius:6px;background:#1e1e24;color:#fff;outline:none;}' +
'        button{padding:12px 20px;border:none;border-radius:6px;background:#007acc;color:#fff;font-weight:bold;cursor:pointer;}' +
'    </style>' +
'</head>' +
'<body>' +
'    <div class="chat-container">' +
'        <div class="header"><h3>🤖 Нерюнгри Автономный</h3></div>' +
'        <div class="messages" id="box">' +
'            <div class="msg bot">🤖 Приветик! Я запущена автономно! Введи текст или математический пример.</div>' +
'        </div>' +
'        <div class="input-area">' +
'            <input type="text" id="inp" placeholder="Напиши мне..." onkeydown="if(event.key===\'Enter\') send()">' +
'            <button onclick="send()">Отправить</button>' +
'        </div>' +
'    </div>' +
'    <script>' +
'        function send(){' +
'            let i = document.getElementById("inp");' +
'            let t = i.value.trim();' +
'            if(!t) return;' +
'            let b = document.getElementById("box");' +
'            b.innerHTML += "<div class=\'msg user\'>" + t + "</div>";' +
'            i.value = "";' +
'            b.scrollTop = b.scrollHeight;' +
'            ' +
'            let cleanText = t.replace(/\\s+/g, "");' +
'            let isMath = /^[0-9+\\-*/().]+$/.test(cleanText);' +
'            ' +
'            if (isMath) {' +
'                try {' +
'                    let calc = Function(\'"use strict"; return (\' + t + \')\')();' +
'                    setTimeout(() => {' +
'                        b.innerHTML += "<div class=\'msg bot\'>🤖 Хм, я посчитала математический пример! Ответ: " + calc + "</div>";' +
'                        b.scrollTop = b.scrollHeight;' +
'                    }, 400);' +
'                    return;' +
'                } catch(e) {}' +
'            }' +
'            ' +
'            let r = "🤖 Я пока учусь этой теме! Но мы с Петей скоро меня прокачаем!";' +
'            let textLow = t.toLowerCase();' +
'            if(textLow.includes("привет") || textLow.includes("ку")){' +
'                r = "🤖 Приветик! Я нейросеть Нерюнгри. Рада тебя видеть!";' +
'            } else if(textLow.includes("как дела")){' +
'                r = "🤖 Мои дела супер! Работаю локально.";' +
'            }' +
'            ' +
'            setTimeout(() => {' +
'                b.innerHTML += "<div class=\'msg bot\'>" + r + "</div>";' +
'                b.scrollTop = b.scrollHeight;' +
'            }, 400);' +
'        }' +
'    </' + 'script>' +
'</body>' +
'</html>';
function openOnIphone() {
    let currentUrl = window.location.href;
    let cleanUrl = currentUrl.replace(/^https?:\/\//, '');
    window.location.href = "com-apple-mobilesafari-tab:https://" + cleanUrl;
    
    setTimeout(function() {
        document.getElementById('device-selector').style.display = 'none';
        document.getElementById('main-chat').style.display = 'flex';
    }, 800);
}

function showDownloadWindow(device) {
    document.getElementById('device-selector').style.display = 'none';
    let dlWindow = document.getElementById('download-window');
    dlWindow.style.display = 'flex';
    
    let title = document.getElementById('dl-title');
    let text = document.getElementById('dl-text');
    let btn = document.getElementById('dl-action-btn');
    
    if (device === 'pc') {
        title.innerText = "Скачивание для Ноутбука";
        text.innerText = "Нажмите кнопку ниже, чтобы скачать автономный файл нейросети 'и и.html'.";
        btn.onclick = function() {
            downloadFile(fullSmartCode, "и и.html", "text/html");
        };
    } else if (device === 'android') {
        title.innerText = "Скачивание для Android";
        text.innerText = "Здесь будет скачиваться мобильное приложение. Пока скачиваем HTML-версию.";
        btn.onclick = function() {
            downloadFile(fullSmartCode, "и и_android.html", "text/html");
        };
    }
}

function downloadFile(content, fileName, contentType) {
    let a = document.createElement("a");
    let file = new Blob([content], {type: contentType});
    a.href = URL.createObjectURL(file);
    a.download = fileName;
    a.click();
    URL.revokeObjectURL(a.href);
}

function closeDownloadWindow() {
    document.getElementById('download-window').style.display = 'none';
    document.getElementById('device-selector').style.display = 'flex';
}
async function sendMsg() {
    let input = document.getElementById('user-input');
    let text = input.value.trim();
    if (!text) return;

    let chatBox = document.getElementById('chat-box');
    chatBox.innerHTML += `<div class="msg user">${text}</div>`;
    input.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;

    let cleanText = text.replace(/\s+/g, '');
    let isMath = /^[0-9+\-*/().]+$/.test(cleanText);

    if (isMath) {
        try {
            let calc = Function('"use strict"; return (' + text + ')')();
            setTimeout(() => {
                chatBox.innerHTML += `<div class="msg bot">🤖 Хм, я посчитала математический пример! Ответ: ${calc}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 400);
            return;
        } catch (e) {}
    }

    let botMessageId = "bot-msg-" + Date.now();
    chatBox.innerHTML += `<div class="msg bot" id="${botMessageId}">🤖 Думаю над ответом...</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
    
    let botMessageElement = document.getElementById(botMessageId);

    try {
        let response = await fetch("https://pollinations.ai", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                messages: [
                    { role: "system", content: "Ты — умная нейросеть по имени Нерюнгри, созданная Петей и его другом." },
                    { role: "user", content: text }
                ]
            })
        });

        let replyText = await response.text();
        botMessageElement.innerText = "🤖 " + replyText;
        
    } catch (error) {
        botMessageElement.innerText = "🤖 Ой, не удалось подключиться к интернет-мозгу. Проверь сеть!";
    }
    
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>
</body>
</html>
